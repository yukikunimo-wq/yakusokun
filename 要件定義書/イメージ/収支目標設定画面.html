<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8月の収支設定</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                 "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: #333;
    background: #fff;
}
.screen {
    width: 100%;
    max-width: 606px;
    min-height: 372px;
    margin: 0 auto;
    background: #fff;
}
.status-bar {
    height: 22px;
    position: relative;
    font-size: 12px;
    color: #222;
    font-weight: 600;
}
.time {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 2px;
}
.signal {
    position: absolute;
    left: 7px;
    top: 4px;
    font-size: 13px;
    letter-spacing: -2px;
}
.battery {
    position: absolute;
    right: 8px;
    top: 4px;
    font-size: 12px;
    letter-spacing: -1px;
}
.header {
    height: 31px;
    border-bottom: 1px solid #d7d7d7;
    background: linear-gradient(#fff, #f5f7f8);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
.back {
    position: absolute;
    left: 13px;
    top: 1px;
    height: 28px;
    display: flex;
    align-items: center;
    color: #555;
    font-size: 18px;
}
.back-arrow {
    width: 14px;
    height: 14px;
    border-left: 3px solid #777;
    border-bottom: 3px solid #777;
    transform: rotate(45deg);
    margin-right: 5px;
}
.title {
    font-size: 22px;
    font-weight: 700;
    color: #222;
}
.section-title {
    height: 28px;
    padding: 5px 35px 0;
    font-size: 17px;
    font-weight: 500;
    background: linear-gradient(#f5fafc, #edf5f8);
    border-bottom: 1px solid #e1e7e9;
}
.form { padding-top: 14px; }
.label {
    margin-left: 42px;
    margin-bottom: 7px;
    font-size: 19px;
    font-weight: 700;
    color: #333;
}
.input {
    display: block;
    width: calc(100% - 63px);
    height: 48px;
    margin-left: 32px;
    margin-bottom: 7px;
    padding: 0 14px;
    border: 1px solid #c9c9c9;
    border-radius: 12px;
    background: linear-gradient(#eee, #e6e6e6);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.10),
                0 1px 1px rgba(0,0,0,.08);
    font-size: 18px;
    color: #555;
    outline: none;
}
.input::placeholder { color: #777; opacity: 1; }
.divider {
    height: 1px;
    margin: 0 0 9px;
    background: #e5e5e5;
}
.register {
    display: block;
    width: calc(100% - 64px);
    height: 51px;
    margin: 12px 32px 0;
    border: 1px solid #004d9f;
    border-radius: 11px;
    background: linear-gradient(#0967bd, #0054a8);
    box-shadow: 0 2px 4px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.18);
    color: #fff;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
}
.register:active {
    background: linear-gradient(#0054a8, #004895);
    transform: translateY(1px);
}
</style>
</head>
<body>
<div class="screen">
   
    <div class="header">
        <div class="back">
            <span class="back-arrow"></span>
            <span>戻る</span>
        </div>
        <div class="title">8月の収支設定</div>
    </div>

    <div class="section-title">収入</div>

    <div class="form">
        <div class="label">［収入金額］</div>
        <input class="input" type="text" placeholder="例：250,000円">

        <div class="divider"></div>

        <div class="label">［目標出費額］</div>
        <input class="input" type="text" placeholder="例：180,000円">

        <button class="register" type="button">登録</button>
    </div>
</div>
</body>
</html>
