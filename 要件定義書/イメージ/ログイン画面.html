<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>やくそくんカレンダー ログイン</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: #15375f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

/* =========================
   ページ全体
========================= */

.page {
  width: min(calc(100% - 32px), 1100px);
  margin: 0 auto;
  padding: clamp(30px, 5vw, 60px) 0 70px;
}

/* =========================
   ロゴ
========================= */

.logo {
  display: block;
  width: clamp(280px, 75vw, 850px);
  max-width: 100%;
  height: auto;
  margin: 0 auto clamp(25px, 4vw, 45px);
  object-fit: contain;
}

/* =========================
   ログインカード
========================= */

.card {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;

  background: #fff;
  border: 1px solid #e9e9e9;
  border-radius: clamp(18px, 2vw, 25px);

  box-shadow: 0 4px 18px rgba(0, 0, 0, .08);

  padding:
    clamp(35px, 5vw, 62px)
    clamp(20px, 4vw, 42px)
    clamp(30px, 4vw, 45px);
}

/* =========================
   見出し
========================= */

h1 {
  margin: 0;

  text-align: center;

  font-size: clamp(24px, 2.8vw, 35px);
  line-height: 1.4;
  font-weight: 900;
}

/* =========================
   説明文
========================= */

.lead {
  margin:
    clamp(14px, 2vw, 20px)
    0
    clamp(30px, 4vw, 52px);

  text-align: center;

  color: #555;

  font-size: clamp(15px, 1.8vw, 23px);
}

/* =========================
   入力項目
========================= */

.field {
  margin-bottom: clamp(22px, 3vw, 38px);
}

/* ラベル */

label {
  display: block;

  margin-bottom: 13px;

  font-size: clamp(17px, 1.8vw, 23px);
  font-weight: 900;
}

/* 入力欄の位置調整用 */

.input-wrap {
  position: relative;
}

/* =========================
   入力欄
========================= */

input {
  width: 100%;

  height: clamp(58px, 6vw, 78px);

  border: 2px solid #d9d9d9;
  border-radius: 14px;

  padding:
    0
    clamp(50px, 5vw, 65px);

  font-size: clamp(16px, 1.6vw, 21px);

  outline: none;

  color: #333;
  background: #fff;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

input:focus {
  border-color: #4285e8;

  box-shadow:
    0 0 0 3px rgba(66, 133, 232, .12);
}

input::placeholder {
  color: #aaa;
}

/* =========================
   アイコン共通
========================= */

.icon {
  position: absolute;

  left: clamp(18px, 2.3vw, 24px);

  top: 50%;

  transform: translateY(-50%);

  color: #888;
}

/* =========================
   メールアイコン
========================= */

.mail {
  width: clamp(24px, 2.8vw, 29px);
  height: clamp(21px, 2.5vw, 25px);

  border: 3px solid #888;
  border-radius: 4px;
}

.mail:before,
.mail:after {
  content: "";

  position: absolute;

  width: clamp(15px, 1.8vw, 18px);
  height: 3px;

  background: #888;

  top: 8px;
}

.mail:before {
  left: 0;

  transform: rotate(31deg);
  transform-origin: left;
}

.mail:after {
  right: 0;

  transform: rotate(-31deg);
  transform-origin: right;
}

/* =========================
   ロックアイコン
========================= */

.lock {
  width: clamp(23px, 2.6vw, 27px);
  height: clamp(22px, 2.5vw, 25px);

  border: 3px solid #888;
  border-radius: 4px;
}

.lock:before {
  content: "";

  position: absolute;

  width: clamp(11px, 1.3vw, 13px);
  height: clamp(11px, 1.3vw, 13px);

  left: 4px;
  top: -14px;

  border: 3px solid #888;
  border-bottom: 0;

  border-radius: 10px 10px 0 0;
}

/* =========================
   パスワード表示アイコン
========================= */

.eye {
  position: absolute;

  right: clamp(18px, 2.4vw, 25px);

  top: 50%;

  transform: translateY(-50%);

  width: clamp(30px, 3.2vw, 35px);
  height: clamp(21px, 2.4vw, 24px);

  cursor: pointer;
}

.eye:before {
  content: "";

  position: absolute;

  inset: 0;

  border: 3px solid #888;
  border-radius: 50%;

  transform: scaleY(.72);
}

.eye:after {
  content: "";

  position: absolute;

  width: clamp(8px, 1vw, 9px);
  height: clamp(8px, 1vw, 9px);

  background: #888;

  border-radius: 50%;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);
}

/* =========================
   ログインボタン
========================= */

.login {
  width: 100%;

  height: clamp(58px, 6vw, 79px);

  border: 0;
  border-radius: 13px;

  background:
    linear-gradient(
      180deg,
      #3887e5,
      #2169ce
    );

  color: #fff;

  font-size: clamp(20px, 2vw, 27px);
  font-weight: 900;

  cursor: pointer;

  transition:
    opacity .2s ease,
    transform .1s ease;
}

.login:hover {
  opacity: .9;
}

.login:active {
  transform: translateY(1px);
}

/* =========================
   区切り
========================= */

.divider {
  display: flex;

  align-items: center;

  gap: clamp(10px, 2vw, 22px);

  margin:
    clamp(22px, 3vw, 34px)
    0
    clamp(16px, 2vw, 22px);

  color: #555;

  font-size: clamp(14px, 1.6vw, 21px);

  font-weight: 700;

  white-space: nowrap;
}

.divider:before,
.divider:after {
  content: "";

  flex: 1;

  height: 2px;

  background: #ddd;
}

/* =========================
   新規登録ボタン
========================= */

.register {
  display: flex;

  align-items: center;
  justify-content: center;

  height: clamp(52px, 5vw, 66px);

  border: 2px solid #4c8ee7;
  border-radius: 12px;

  color: #176dd1;

  text-decoration: none;

  font-size: clamp(17px, 1.8vw, 24px);
  font-weight: 900;

  background: #fff;

  transition:
    background-color .2s ease,
    color .2s ease;
}

.register:hover {
  background: #f4f8ff;
}

/* =========================
   スマートフォン
========================= */

@media (max-width: 600px) {

  .page {
    width: calc(100% - 24px);

    padding:
      24px
      0
      40px;
  }

  .logo {
    width: min(100%, 420px);

    margin-bottom: 24px;
  }

  .card {
    border-radius: 18px;

    padding:
      32px
      18px
      28px;
  }

  h1 {
    font-size: 24px;
  }

  .lead {
    font-size: 15px;

    margin:
      12px 0 30px;
  }

  label {
    font-size: 17px;

    margin-bottom: 10px;
  }

  .field {
    margin-bottom: 22px;
  }

  input {
    height: 58px;

    padding:
      0 50px;

    font-size: 16px;

    border-radius: 12px;
  }

  .icon {
    left: 18px;
  }

  .eye {
    right: 18px;
  }

  .login {
    height: 58px;

    font-size: 20px;

    border-radius: 12px;
  }

  .divider {
    font-size: 14px;

    gap: 9px;

    margin:
      23px 0 15px;
  }

  .register {
    height: 52px;

    font-size: 17px;

    border-radius: 11px;
  }
}

/* =========================
   非常に小さいスマートフォン
========================= */

@media (max-width: 380px) {

  .page {
    width: calc(100% - 18px);

    padding-top: 18px;
  }

  .card {
    padding:
      28px
      14px
      24px;
  }

  h1 {
    font-size: 21px;
  }

  .lead {
    font-size: 14px;
  }

  label {
    font-size: 16px;
  }

  input {
    font-size: 15px;
  }

  .divider {
    font-size: 13px;
  }

  .register {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<main class="page">

  <!-- ロゴ -->
  <img
    class="logo"
    src="yaku-schedule-logo.png"
    alt="やくそくんカレンダー ロゴ"
  >

  <!-- ログインカード -->
  <section class="card">

    <h1>
      ようこそ！やくそくんカレンダーへ
    </h1>

    <p class="lead">
      ログインして、あなたの予定と収支を管理しましょう
    </p>

    <form id="loginForm">

      <!-- メールアドレス -->
      <div class="field">

        <label for="email">
          メールアドレス
        </label>

        <div class="input-wrap">

          <span
            class="icon mail"
            aria-hidden="true">
          </span>

          <input
            id="email"
            type="email"
            placeholder="メールアドレスを入力してください"
            autocomplete="email"
            required
          >

        </div>
      </div>

      <!-- パスワード -->
      <div class="field">

        <label for="password">
          パスワード
        </label>

        <div class="input-wrap">

          <span
            class="icon lock"
            aria-hidden="true">
          </span>

          <input
            id="password"
            type="password"
            placeholder="パスワードを入力してください"
            autocomplete="current-password"
            required
          >

          <span
            class="eye"
            id="togglePassword"
            aria-label="パスワードを表示"
            role="button"
            tabindex="0">
          </span>

        </div>
      </div>

      <!-- ログイン -->
      <button
        class="login"
        type="submit">
        ログイン
      </button>

      <!-- 区切り -->
      <div class="divider">
        アカウントをお持ちでない方
      </div>

      <!-- 新規登録 -->
      <a
        href="#"
        class="register"
        id="register">
        新規登録はこちら
      </a>

    </form>

  </section>

</main>

<script>

/* =========================
   パスワード表示・非表示
========================= */

const password =
  document.getElementById("password");

const toggle =
  document.getElementById("togglePassword");

function togglePassword() {

  password.type =
    password.type === "password"
      ? "text"
      : "password";
}

toggle.addEventListener(
  "click",
  togglePassword
);

toggle.addEventListener(
  "keydown",
  (e) => {

    if (
      e.key === "Enter" ||
      e.key === " "
    ) {

      e.preventDefault();

      togglePassword();
    }
  }
);


/* =========================
   ログイン処理
========================= */

document
  .getElementById("loginForm")
  .addEventListener("submit", (e) => {

    e.preventDefault();

    alert(
      "ログイン処理をここに接続してください。"
    );
  });


/* =========================
   新規登録
========================= */

document
  .getElementById("register")
  .addEventListener("click", (e) => {

    e.preventDefault();

    alert(
      "新規登録ページをここに接続してください。"
    );
  });

</script>

</body>
</html>
